name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - library:/data
      - backup:/data/backups
      - external-libraries:/external-libraries
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Europe/Moscow
    ports:
      - 0.0.0.0:2283:2283
      - 0.0.0.0:8081:8081
      - 0.0.0.0:8082:8082
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false
    user: ${IMMICH_USER_ID}:${IMMICH_GROUP_ID}
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2
    restart: always
    healthcheck:
      disable: false
    user: ${IMMICH_USER_ID}:${IMMICH_GROUP_ID}
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    volumes:
      - redis:/data
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always
    env_file:
      - .env

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: --data-checksums
      DB_STORAGE_TYPE: HDD
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false
    env_file:
      - .env

volumes:
  model-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MODEL_CACHE_LOCATION}
  postgres:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DB_DATA_LOCATION}
  redis:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REDIS_DATA_LOCATION}
  backup:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUP_LOCATION}
  library:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${UPLOAD_LOCATION}
  external-libraries:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${EXTERNAL_LIBRARIES_LOCATION}
